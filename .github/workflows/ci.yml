name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge test -vv
        working-directory: contracts

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: foundry-rs/foundry-toolchain@v1 # forge inspect for ABI gen if needed
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @custos/api prisma:generate
      - run: pnpm --filter @custos/sdk build
      - run: pnpm --filter @custos/api build   # tsc --noEmit
      - run: pnpm --filter @custos/api test
      - run: pnpm --filter @custos/dashboard build
        env:
          DEPLOYMENTS_FILE: ${{ github.workspace }}/contracts/deployments/ci-placeholder.json
