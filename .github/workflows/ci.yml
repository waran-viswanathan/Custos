name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { submodules: recursive }
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge fmt --check
        working-directory: contracts
      - run: forge build --sizes
        working-directory: contracts
      - run: forge test -vv
        working-directory: contracts

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { submodules: recursive }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: pnpm }
      - uses: foundry-rs/foundry-toolchain@v1
      - run: pnpm install --frozen-lockfile
      - run: bash -n scripts/*.sh scripts/lib/*.sh
      - run: node --check site/app.js
      - run: pnpm --filter @custos/api prisma:generate
      - run: pnpm --filter @custos/api exec prisma validate
        env:
          DATABASE_URL: postgresql://custos:custos@localhost:5432/custos
      - run: test ! -e sdk/src/abis.ts && git check-ignore sdk/src/abis.ts
      - run: pnpm --filter @custos/sdk gen:abis
      - run: pnpm --filter @custos/sdk build
      - run: pnpm --filter @custos/sdk test
      - run: pnpm --filter @custos/api build
      - run: pnpm --filter @custos/api test
      - run: pnpm --filter @custos/dashboard test
      - run: pnpm --filter @custos/demo-agent build
      - run: pnpm --filter @custos/dashboard build
        env:
          DEPLOYMENTS_FILE: ${{ github.workspace }}/contracts/deployments/ci-placeholder.json
          SESSION_SECRET: ci-only-session-secret-not-for-production
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high

  demo-smoke:
    needs: [contracts, node]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql://custos:custos@localhost:5432/custos
      REDIS_URL: redis://localhost:6379
      API_URL: http://127.0.0.1:4000
    steps:
      - uses: actions/checkout@v5
        with: { submodules: recursive }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: pnpm }
      - uses: foundry-rs/foundry-toolchain@v1
      - run: pnpm install --frozen-lockfile
      - run: timeout 5m pnpm demo
      - if: always()
        run: docker compose down --volumes
